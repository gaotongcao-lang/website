```html
<section class="contact" id="contact">
    <h2 class="contact__headline">Let's chat</h2>

    <div class="wrapper contact__wrapper section-border">

        <div class="contact__text">

            <h3 class="contact__name">Evan Cao</h3>

            <div class="contact__socials">

                <!-- LinkedIn -->
                <div class="contact__socials-item">
                    <a
                        class="socials__linkedin"
                        href="https://www.linkedin.com/in/evan-cao-a3b76b433/"
                        target="_blank"
                    >
                        <span class="subtext">LinkedIn</span>
                        <img
                            src="assets/icons/icon-linkedin.png"
                            class="socials__linkedin-icon"
                            alt="LinkedIn"
                        >
                    </a>
                </div>

                <!-- Instagram -->
                <div class="contact__socials-item">
                    <a
                        class="socials__insta"
                        href="https://www.instagram.com/gaotong836/"
                        target="_blank"
                    >
                        <span class="subtext">Instagram</span>
                        <img
                            src="assets/icons/icon-insta.png"
                            class="socials__insta-icon"
                            alt="Instagram"
                        >
                    </a>
                </div>

            </div>
        </div>


        <!-- Contact Form -->
        <form
            action="mailto:YOUR_EMAIL@example.com"
            method="post"
            enctype="text/plain"
            class="contact__form"
        >

            <div class="contact__control">
                <label for="name"></label>

                <input
                    type="text"
                    id="name"
                    name="Name"
                    placeholder="Name"
                    maxlength="30"
                    required
                >

                <img
                    src="assets/icons/icon-error.svg"
                    class="contact__invalid-icon"
                    alt=""
                >
            </div>


            <div class="contact__control">
                <label for="email"></label>

                <input
                    type="email"
                    id="email"
                    name="Email"
                    placeholder="Email"
                    required
                >

                <img
                    src="assets/icons/icon-error.svg"
                    class="contact__invalid-icon"
                    alt=""
                >
            </div>


            <div class="contact__control">
                <label for="message"></label>

                <textarea
                    id="message"
                    name="Message"
                    placeholder="Message"
                    cols="30"
                    rows="3"
                    maxlength="300"
                    required
                ></textarea>
            </div>


            <div class="contact__control align-right">
                <button
                    type="submit"
                    class="button contact__button"
                >
                    Send
                </button>
            </div>

        </form>

    </div>
</section>
```
