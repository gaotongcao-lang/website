<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Evan Cao | Blog</title>
    <meta name="description" content="Evan Cao's personal blog">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pathway+Extreme:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap"
          rel="stylesheet">
</head>

<body>
    <main class="main">

        <header class="header">
            <nav class="wrapper article-nav">
                <a href="index.html">
                    <img src="assets/icons/icon-back-arrow.png" alt="Back">
                </a>
            </nav>
        </header>

        <section class="article-details">
            <div class="wrapper article-details__wrapper bloglist__wrapper">

                <h1 class="article-details__title">My Blog</h1>

                <p class="article-details__date">
                    <i>Welcome to my blog.</i>
                </p>

                <div class="article-details__info">
                    <p class="article-details__details section-border">
                        A place where I share my ideas, experiences, projects, and things I learn along the way.
                    </p>
                </div>

            </div>
        </section>

        <section class="bloglist">
            <div class="wrapper bloglist__wrapper section-border">

                <div class="bloglist__year-area">

                    <h2 class="bloglist__year">Coming Soon</h2>

                    <div class="bloglist__item-area timeline-border-left">

                        <div class="bloglist__item">
                            <p>
                                <i>New posts will be here soon.</i>
                            </p>
                        </div>

                    </div>

                </div>

            </div>
        </section>

        <footer class="footer">
            <div class="wrapper footer__wrapper">

                <div class="footer__item subtext">
                    <p>© 2026 Evan Cao</p>
                </div>

            </div>
        </footer>

    </main>
</body>
</html>
